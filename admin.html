<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Admin - Cardápio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1e1e1e; color: #fff; min-height: 100vh; }
    header { background: #333; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ff6b35; }
    header h1 { font-size: 1.2rem; color: #ff6b35; }
    button { cursor: pointer; border: none; border-radius: 8px; padding: 10px 16px; font-weight: 600; transition: 0.2s; }
    .btn-primary { background: #ff6b35; color: white; }
    .btn-danger { background: #d32f2f; color: white; padding: 6px 10px; font-size: 0.85rem;}
    .btn-ghost { background: transparent; color: white; border: 1px solid white; }
    
    main { max-width: 800px; margin: 20px auto; padding: 0 20px; }
    
    #login-screen { max-width: 400px; margin: 80px auto; background: #333; padding: 30px; border-radius: 12px; text-align: center; }
    #login-screen h2 { margin-bottom: 20px; color: #ff6b35; }
    #login-screen input { width: 100%; padding: 12px; margin-bottom: 12px; border: none; border-radius: 8px; }
    .msg { color: #ff5252; font-size: 0.9rem; margin-top: 10px; min-height: 20px; }

    #admin-screen { display: none; }
    .card { background: #2b2b2b; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
    .card h3 { margin-bottom: 15px; color: #ff6b35; font-size: 1.1rem; }
    .form-group { display: flex; flex-direction: column; gap: 10px; }
    .form-row { display: flex; gap: 10px; }
    .form-row > * { flex: 1; }
    input, select { padding: 10px; border-radius: 8px; border: 1px solid #555; background: #1e1e1e; color: white; width: 100%; }
    
    .product-list { display: flex; flex-direction: column; gap: 10px; }
    .product-item { background: #333; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .product-item div { flex: 1; min-width: 200px; }
    .product-item h4 { margin-bottom: 5px; color: #fff; }
    .product-item p { font-size: 0.85rem; color: #aaa; }
    .product-item span { color: #ff6b35; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <h1>⚙️ Painel do Restaurante</h1>
    <div id="header-user" style="display:none;">
      <button class="btn-ghost" onclick="logout()">Sair</button>
    </div>
  </header>

  <!-- TELA DE LOGIN -->
  <section id="login-screen">
    <h2>Acesso Restrito</h2>
    <form onsubmit="handleLogin(event)">
      <input type="email" id="email" placeholder="E-mail do Administrador" required />
      <input type="password" id="password" placeholder="Senha" required />
      <button type="submit" class="btn-primary" style="width:100%">Entrar no Painel</button>
    </form>
    <div class="msg" id="login-msg"></div>
  </section>

  <!-- PAINEL ADMIN -->
  <section id="admin-screen">
    <main>
      <!-- FORMULÁRIO ADICIONAR -->
      <div class="card">
        <h3>Adicionar Novo Produto</h3>
        <form onsubmit="addProduct(event)" class="form-group">
          <div class="form-row">
            <input type="text" id="prod-name" placeholder="Nome (ex: X-Burger)" required />
            <input type="text" id="prod-emoji" placeholder="Emoji (ex: 🍔)" required maxlength="2" />
          </div>
          <input type="text" id="prod-desc" placeholder="Descrição curta" required />
          <div class="form-row">
            <input type="number" step="0.01" id="prod-price" placeholder="Preço (ex: 19.90)" required />
            <select id="prod-cat" required>
              <option value="lanche">Lanches</option>
              <option value="pizza">Pizzas</option>
              <option value="bebida">Bebidas</option>
              <option value="sobremesa">Sobremesas</option>
            </select>
          </div>
          <button type="submit" class="btn-primary">Cadastrar Produto</button>
        </form>
      </div>

      <!-- LISTA DE PRODUTOS -->
      <div class="card">
        <h3>Produtos Cadastrados</h3>
        <div class="product-list" id="admin-product-list">
          <p style="color:#aaa">Carregando...</p>
        </div>
      </div>
    </main>
  </section>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAhE4mUNfF7K-5jmcZEmsRYWRtssPecDsM",
      authDomain: "cardapio-digital-b4e42.firebaseapp.com",
      projectId: "cardapio-digital-b4e42",
      storageBucket: "cardapio-digital-b4e42.firebasestorage.app",
      messagingSenderId: "104030449529",
      appId: "1:104030449529:web:17fd5ff1f328bae0efc9a8"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // E-mail de administrador
    const ADMIN_EMAIL = "contaefootball24@gmail.com";

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const msg = document.getElementById("login-msg");
      
      msg.textContent = "Verificando...";

      try {
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        
        // Verifica se é o admin
        if (userCredential.user.email === ADMIN_EMAIL) {
          msg.textContent = "";
          showAdminPanel();
        } else {
          await auth.signOut();
          msg.textContent = "Acesso negado. Esta conta não é de administrador.";
        }
      } catch (err) {
        msg.textContent = "E-mail ou senha incorretos.";
      }
    }

    function logout() {
      auth.signOut().then(() => {
        document.getElementById("admin-screen").style.display = "none";
        document.getElementById("login-screen").style.display = "block";
        document.getElementById("header-user").style.display = "none";
        document.getElementById("email").value = "";
        document.getElementById("password").value = "";
      });
    }

    function showAdminPanel() {
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("admin-screen").style.display = "block";
      document.getElementById("header-user").style.display = "block";
      loadProducts();
    }

    async function loadProducts() {
      const list = document.getElementById("admin-product-list");
      list.innerHTML = '<p style="color:#aaa">Carregando produtos...</p>';
      
      try {
        const snapshot = await db.collection('produtos').orderBy('name').get();
        
        if (snapshot.empty) {
          list.innerHTML = '<p style="color:#aaa">Nenhum produto cadastrado ainda.</p>';
          return;
        }

        list.innerHTML = "";
        snapshot.forEach(doc => {
          const p = doc.data();
          const div = document.createElement("div");
          div.className = "product-item";
          div.innerHTML = `
            <div>
              <h4>${p.emoji} ${p.name}</h4>
              <p>${p.desc} | Categoria: ${p.cat}</p>
              <span>R$ ${parseFloat(p.price).toFixed(2)}</span>
            </div>
            <div style="flex: 0; display: flex; gap: 5px;">
              <button class="btn-danger" onclick="deleteProduct('${doc.id}')">Excluir</button>
            </div>
          `;
          list.appendChild(div);
        });
      } catch (error) {
        list.innerHTML = '<p style="color:red">Erro ao carregar produtos.</p>';
      }
    }

    async function addProduct(e) {
      e.preventDefault();
      const name = document.getElementById("prod-name").value;
      const emoji = document.getElementById("prod-emoji").value;
      const desc = document.getElementById("prod-desc").value;
      const price = document.getElementById("prod-price").value;
      const cat = document.getElementById("prod-cat").value;

      try {
        await db.collection('produtos').add({
          name: name,
          emoji: emoji,
          desc: desc,
          price: parseFloat(price),
          cat: cat
        });
        
        // Limpar formulário
        document.getElementById("prod-name").value = "";
        document.getElementById("prod-emoji").value = "";
        document.getElementById("prod-desc").value = "";
        document.getElementById("prod-price").value = "";
        
        // Recarregar lista
        loadProducts();
      } catch (error) {
        alert("Erro ao adicionar produto: " + error.message);
      }
    }

    async function deleteProduct(id) {
      if (confirm("Tem certeza que deseja excluir este produto?")) {
        try {
          await db.collection('produtos').doc(id).delete();
          loadProducts();
        } catch (error) {
          alert("Erro ao excluir: " + error.message);
        }
      }
    }

    auth.onAuthStateChanged((user) => {
      if (user && user.email === ADMIN_EMAIL) {
        showAdminPanel();
      } else {
        document.getElementById("admin-screen").style.display = "none";
        document.getElementById("login-screen").style.display = "block";
      }
    });
  </script>
</body>
  </html>
